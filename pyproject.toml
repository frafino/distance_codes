[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "directional-tile-codes"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "matplotlib",
    "qldpc",
    "galois",
    "networkx"
]

[tool.setuptools.packages.find]
where = ["src"]
